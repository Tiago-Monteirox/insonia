[project]
name = "insonia"
version = "0.1.0"
description = "Sistema de gerenciamento de loja e ponto de venda (PDV)"
requires-python = ">=3.12"
dependencies = [
    "django==6.0.4",
    "djangorestframework==3.17.1",
    "graphene-django==3.2.3",
    "django-filter==25.2",
    "django-money==3.5.3",
    "py-moneyed==3.0",
    "pillow==12.2.0",
    "psycopg2-binary==2.9.10",
    "boto3==1.37.33",
    "asgiref==3.11.1",
    "babel==2.17.0",
    "python-dateutil==2.9.0.post0",
    "text-unidecode==1.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "insonia.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
